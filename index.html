<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Компьютерный клуб CyberClub</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Единая шапка -->
  <header>
    <a href="index.html" class="logo">🎮 CyberClub</a>
    <ul class="nav-links">
      <li><a href="index.html" class="active">Главная</a></li>
      <li><a href="catalog.html">Каталог</a></li>
      <li><a href="contacts.html">Контакты</a></li>
    </ul>
    <div class="auth-buttons">
      <button class="btn btn-login open-login-btn">Войти</button>
      <button class="btn btn-register open-register-btn">Регистрация</button>
    </div>
  </header>

  <main>
    <h2>Добро пожаловать в CyberClub</h2>
  </main>

  <!-- Модальное окно: Вход -->
  <div id="loginModal" class="modal">
    <div class="modal-content">
      <button class="close-btn">&times;</button>
      <h3>Авторизация</h3>
      <form>
        <div class="form-group">
          <label>Логин:</label>
          <input type="text" required>
        </div>
        <div class="form-group">
          <label>Пароль:</label>
          <input type="password" required>
        </div>
        <button type="submit" class="btn btn-register" style="width: 100%; margin-top: 10px;">Войти</button>
      </form>
    </div>
  </div>

  <!-- Модальное окно: Регистрация -->
  <div id="registerModal" class="modal">
    <div class="modal-content">
      <button class="close-btn">&times;</button>
      <h3>Регистрация</h3>
      <form>
        <div class="form-group">
          <label>Логин:</label>
          <input type="text" required>
        </div>
        <div class="form-group">
          <label>Email:</label>
          <input type="email" required>
        </div>
        <div class="form-group">
          <label>Пароль:</label>
          <input type="password" required>
        </div>
        <button type="submit" class="btn btn-register" style="width: 100%; margin-top: 10px;">Создать аккаунт</button>
      </form>
    </div>
  </div>

  <footer>
    <p>&copy; 2026 CyberClub. Компьютерный клуб. Лабораторная работа.</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
